<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#eef2ff',
                        100: '#e0e7ff',
                        200: '#c7d2fe',
                        300: '#a5b4fc',
                        400: '#818cf8',
                        500: '#6366f1',
                        600: '#4f46e5',
                        700: '#4338ca',
                        800: '#3730a3',
                        900: '#312e81',
                    },
                    secondary: {
                        50: '#ecfdf5',
                        100: '#d1fae5',
                        200: '#a7f3d0',
                        300: '#6ee7b7',
                        400: '#34d399',
                        500: '#10b981',
                        600: '#059669',
                        700: '#047857',
                        800: '#065f46',
                        900: '#064e3b',
                    },
                    accent: {
                        50: '#fdf2f8',
                        100: '#fce7f3',
                        200: '#fbcfe8',
                        300: '#f9a8d4',
                        400: '#f472b6',
                        500: '#ec4899',
                        600: '#db2777',
                        700: '#be185d',
                        800: '#9d174d',
                        900: '#831843',
                    }
                },
                animation: {
                    'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                }
            }
        }
    };

    function viewData() {
        return {
            showTranscript: false,
            darkMode: false,
            minimizeSidebar: window.innerWidth < 768,
            textSizePercentage: 100,
            loading: true,
            showToast: false,
            toastTitle: '',
            toastMessage: '',
            toastType: 'success',
            searchModalOpen: false,
            searchQuery: '',
            searchResults: [],
            searchPerformed: false,
            currentSearchResultIndex: null,
            wordCount: 0,
            readingTime: 0,

            file: {
                filename: "{{ file.filename }}",
                upload_time: "{{ file.upload_time.strftime('%Y-%m-%d %H:%M') }}",
                minutes: {{ file.minutes|tojson }},
                transcript: {{ file.transcript|tojson }},
                mind_map: {{ file.mind_map|tojson }},
            },

            init() {
                setTimeout(() => {
                    this.loading = false;
                    this.calculateStats();
                }, 500);

                this.darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;

                window.addEventListener('resize', () => {
                    if (window.innerWidth < 768) {
                        this.minimizeSidebar = true;
                    }
                });

                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    this.darkMode = e.matches;
                });
            },

            calculateStats() {
                const source = this.file.minutes || this.file.transcript || '';
                const text = source.replace(/<[^>]*>/g, ' ');
                const words = text.trim().split(/\s+/).filter(word => word.length > 0);
                this.wordCount = words.length;
                this.readingTime = Math.max(1, Math.ceil(this.wordCount / 200));
            },

            escapeHtml(text) {
                return String(text || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            },

            printMinutes() {
                const content = this.showTranscript ? this.file.transcript : this.file.minutes;
                const title = this.showTranscript ? 'Transcript' : 'Meeting Minutes';

                if (!content) {
                    this.toastTitle = 'Print Unavailable';
                    this.toastMessage = `No ${title.toLowerCase()} content available to print.`;
                    this.toastType = 'error';
                    this.showToast = true;
                    setTimeout(() => {
                        this.showToast = false;
                    }, 3000);
                    return;
                }

                const filename = this.file.filename.replace(/\.[^/.]+$/, '');
                const dateFormatted = new Date(this.file.upload_time).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                }).replace(/\//g, '-');

                const safeTitle = this.escapeHtml(title);
                const safeFilename = this.escapeHtml(filename);
                const safeDate = this.escapeHtml(dateFormatted);
                const safeTranscript = this.escapeHtml(content);
                const bodyContent = this.showTranscript
                    ? `<pre class="transcript">${safeTranscript}</pre>`
                    : `<article class="minutes">${content}</article>`;

                const printWindow = window.open('', '_blank', 'height=900,width=1000');
                if (!printWindow) {
                    this.toastTitle = 'Print Blocked';
                    this.toastMessage = 'Please allow popups to open print preview.';
                    this.toastType = 'error';
                    this.showToast = true;
                    setTimeout(() => {
                        this.showToast = false;
                    }, 3000);
                    return;
                }

                const htmlContent = `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8" />
                        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                        <title>${safeTitle} - ${safeFilename}</title>
                        <style>
                            @page {
                                size: A4;
                                margin: 16mm;
                            }

                            body {
                                font-family: 'Georgia', 'Times New Roman', serif;
                                color: #0f172a;
                                line-height: 1.6;
                                margin: 0;
                                background: #ffffff;
                            }

                            .header {
                                border-bottom: 2px solid #0f766e;
                                padding-bottom: 10px;
                                margin-bottom: 18px;
                            }

                            .kicker {
                                display: inline-block;
                                font-family: Arial, sans-serif;
                                font-size: 11px;
                                letter-spacing: 0.08em;
                                text-transform: uppercase;
                                color: #0f766e;
                                margin-bottom: 6px;
                            }

                            h1 {
                                margin: 0;
                                font-size: 24px;
                                color: #0f172a;
                            }

                            .meta {
                                margin-top: 6px;
                                color: #334155;
                                font-family: Arial, sans-serif;
                                font-size: 12px;
                            }

                            .content {
                                font-size: 14px;
                            }

                            .content h1,
                            .content h2,
                            .content h3,
                            .content h4,
                            .content h5,
                            .content h6 {
                                color: #0f172a;
                                margin-top: 16px;
                                margin-bottom: 8px;
                                line-height: 1.35;
                            }

                            .content p {
                                margin: 8px 0;
                            }

                            .content ul,
                            .content ol {
                                margin: 8px 0 8px 20px;
                            }

                            .content pre,
                            .transcript {
                                white-space: pre-wrap;
                                word-break: break-word;
                                font-family: 'Courier New', monospace;
                                font-size: 12px;
                                background: #f8fafc;
                                border: 1px solid #e2e8f0;
                                border-radius: 8px;
                                padding: 12px;
                            }

                            .content table {
                                width: 100%;
                                border-collapse: collapse;
                                margin: 10px 0;
                            }

                            .content th,
                            .content td {
                                border: 1px solid #cbd5e1;
                                padding: 8px;
                                text-align: left;
                            }

                            .content th {
                                background: #f1f5f9;
                            }

                            .footer {
                                margin-top: 20px;
                                border-top: 1px solid #cbd5e1;
                                padding-top: 8px;
                                color: #475569;
                                font-family: Arial, sans-serif;
                                font-size: 11px;
                                text-align: center;
                            }
                        </style>
                    </head>
                    <body>
                        <header class="header">
                            <div class="kicker">Speak2Summary</div>
                            <h1>${safeTitle}</h1>
                            <div class="meta">File: ${safeFilename} | Generated on: ${safeDate}</div>
                        </header>

                        <section class="content">
                            ${bodyContent}
                        </section>

                        <footer class="footer">Printed via Speak2Summary</footer>
                    </body>
                    </html>`;

                printWindow.document.open();
                printWindow.document.write(htmlContent);
                printWindow.document.close();
                printWindow.focus();
                printWindow.onload = () => {
                    printWindow.print();
                };

                this.showToast = true;
                this.toastTitle = 'Print Preview Opened';
                this.toastMessage = 'Review the styled document and continue printing.';
                this.toastType = 'success';

                setTimeout(() => {
                    this.showToast = false;
                }, 3000);
            },

            decreaseTextSize() {
                if (this.textSizePercentage > 80) {
                    this.textSizePercentage -= 10;
                }
            },

            increaseTextSize() {
                if (this.textSizePercentage < 120) {
                    this.textSizePercentage += 10;
                }
            },

            performSearch() {
                if (!this.searchQuery || this.searchQuery.trim() === '') {
                    return;
                }

                this.searchPerformed = true;
                this.searchResults = [];
                const query = this.searchQuery.toLowerCase();
                const content = this.showTranscript ? this.file.transcript : this.file.minutes;

                if (!content) {
                    return;
                }

                let searchText = content;
                if (!this.showTranscript) {
                    searchText = content.replace(/<[^>]*>/g, ' ');
                }
                searchText = searchText.toLowerCase();

                let startIndex = 0;
                let index;

                while ((index = searchText.indexOf(query, startIndex)) > -1) {
                    const contextStart = Math.max(0, index - 30);
                    const contextEnd = Math.min(searchText.length, index + query.length + 30);
                    let context = searchText.substring(contextStart, contextEnd);

                    if (contextStart > 0) context = '...' + context;
                    if (contextEnd < searchText.length) context = context + '...';

                    this.searchResults.push({
                        index: index,
                        context: context.replace(
                            new RegExp(query, 'gi'),
                            match => `<mark class="highlight-text">${match}</mark>`
                        )
                    });

                    startIndex = index + query.length;
                }

                if (this.searchResults.length > 0) {
                    this.currentSearchResultIndex = 0;
                    this.searchModalOpen = false;

                    setTimeout(() => {
                        this.jumpToSearchResult(0);
                    }, 300);
                }
            },

            highlightSearchResults(content) {
                if (!this.searchQuery || this.searchResults.length === 0) {
                    return content;
                }

                return content.replace(
                    new RegExp(this.searchQuery, 'gi'),
                    match => `<mark class="highlight-text">${match}</mark>`
                );
            },

            jumpToSearchResult(index) {
                this.currentSearchResultIndex = index;

                setTimeout(() => {
                    const highlights = document.querySelectorAll('.highlight-text');
                    if (highlights[index]) {
                        highlights[index].scrollIntoView({
                            behavior: 'smooth',
                            block: 'center'
                        });
                    }
                }, 100);
            },

            nextSearchResult() {
                if (this.currentSearchResultIndex < this.searchResults.length - 1) {
                    this.jumpToSearchResult(this.currentSearchResultIndex + 1);
                }
            },

            previousSearchResult() {
                if (this.currentSearchResultIndex > 0) {
                    this.jumpToSearchResult(this.currentSearchResultIndex - 1);
                }
            },

            clearSearch() {
                this.searchQuery = '';
                this.searchResults = [];
                this.currentSearchResultIndex = null;
                this.searchPerformed = false;
            }
        }
    }
</script>
